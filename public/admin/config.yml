# Website editor settings (Decap CMS). https://decapcms.org/docs/
# Connected to the GitHub repository below. If you name your repository differently, change "repo".

backend:
  name: github
  repo: Rajasal1976/indianvisa
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: 'Add {{collection}}: {{slug}}'
    update: 'Edit {{collection}}: {{slug}}'
    delete: 'Delete {{collection}}: {{slug}}'
    uploadMedia: 'Upload photo {{path}}'

# Lets the editor work on a computer for testing (only when the site runs on localhost)
local_backend: true

site_url: https://indianevisaonline.org.uk
display_url: https://indianevisaonline.org.uk
logo_url: /favicon.png
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------- Pages ----------
  - name: pages
    label: Pages
    label_singular: Page
    description: >-
      Every page on the website. Click a page to edit it, then click Publish: the website updates in about a minute.
      To add a page, click "New Page" (the quickest way is to open a similar page and choose Duplicate from the Publish menu).
      To remove a page, open it and switch on "Move to bin", or delete it. Menus, the homepage tiles, the sitemap and
      search update themselves.
    folder: content/pages
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: h1
    summary: '{{group}} › {{h1}}'
    sortable_fields:
      - { field: group, label: Section, default_sort: asc }
      - { field: order, label: Order in menus }
      - { field: h1, label: Page heading }
    view_groups:
      - { label: Section, field: group }
    preview_path: '{{slug}}/'
    editor: { preview: true }
    fields:
      - { name: layout, label: Page layout, widget: select, default: visa, options: [{ label: 'Visa page (banner, checklist, documents, steps, rules, fees)', value: visa }, { label: 'Section main page (banner and cards for every page in the section)', value: section }, { label: 'Guide or help page', value: guide }, { label: 'Company page (about, privacy, terms...)', value: company }], hint: 'Changes how the page is laid out. Parts you leave empty are not shown.' }
      - { name: group, label: Section of the site, widget: select, default: evisa, options: [{ label: 'e-Visas', value: evisa }, { label: 'Regular visas', value: regular }, { label: 'Help and guides', value: guide }, { label: 'About us', value: company }], hint: 'Decides which menu the page appears in.' }
      - { name: navLabel, label: Name in menus, widget: string, required: false, hint: 'Short name for menus and buttons, e.g. "e-Business visa". If empty, the page heading is used.' }
      - { name: order, label: Order in menus, widget: number, value_type: int, default: 50, required: false, hint: 'Lower numbers come first.' }
      - { name: h1, label: Page heading, widget: string, hint: 'The big heading at the top. When you create a page, the web address is made from this.' }
      - { name: h1Accent, label: Heading second line (saffron), widget: string, required: false, hint: 'Visa and section pages: shown in saffron under the heading, e.g. "from the UK."' }
      - { name: intro, label: Introduction, widget: text, required: false, hint: 'One or two sentences under the heading.' }
      - { name: cardText, label: Short summary for cards, widget: text, required: false, hint: 'Shown on cards and homepage tiles. If empty, the Google description is used.' }
      - { name: highlight, label: Highlight this page's homepage tile in pink, widget: boolean, required: false, default: false }
      - { name: applyButton, label: Apply button, widget: select, default: none, options: [{ label: 'No button', value: 'none' }, { label: 'e-Visa form (any type)', value: '/apply/india-visa/' }, { label: 'e-Visa form: e-Tourist 30 days', value: '/apply/india-visa/?visaType=e-Tourist%20visa%20(30%20days)' }, { label: 'e-Visa form: e-Tourist 1 year', value: '/apply/india-visa/?visaType=e-Tourist%20visa%20(1%20year)' }, { label: 'e-Visa form: e-Tourist 5 years', value: '/apply/india-visa/?visaType=e-Tourist%20visa%20(5%20years)' }, { label: 'e-Visa form: e-Business', value: '/apply/india-visa/?visaType=e-Business%20visa' }, { label: 'e-Visa form: e-Conference', value: '/apply/india-visa/?visaType=e-Conference%20visa' }, { label: 'e-Visa form: e-Medical', value: '/apply/india-visa/?visaType=e-Medical%20visa' }, { label: 'e-Visa form: e-Medical Attendant', value: '/apply/india-visa/?visaType=e-Medical%20Attendant%20visa' }, { label: 'e-Visa form: e-Ayush', value: '/apply/india-visa/?visaType=e-Ayush%20visa' }, { label: 'e-Visa form: e-Ayush Attendant', value: '/apply/india-visa/?visaType=e-Ayush%20Attendant%20visa' }, { label: 'e-Visa form: e-Student', value: '/apply/india-visa/?visaType=e-Student%20visa' }, { label: 'e-Visa form: e-Student Dependent (e-Family)', value: '/apply/india-visa/?visaType=e-Student%20Dependent%20visa' }, { label: 'e-Visa form: e-Transit', value: '/apply/india-visa/?visaType=e-Transit%20visa' }, { label: 'e-Visa form: e-Miscellaneous (e-Entry)', value: '/apply/india-visa/?visaType=e-Miscellaneous%20(e-Entry)%20visa' }, { label: 'e-Visa form: e-Film', value: '/apply/india-visa/?visaType=e-Film%20visa' }, { label: 'e-Visa form: e-Production Investment', value: '/apply/india-visa/?visaType=e-Production%20Investment%20visa' }, { label: 'Regular / Employment visa form', value: '/apply/india-regular-visa/' }, { label: 'Regular visa form: Employment', value: '/apply/india-regular-visa/?visaType=Employment%20visa' }, { label: 'Regular visa form: Business', value: '/apply/india-regular-visa/?visaType=Business%20visa%20(regular)' }, { label: 'Regular visa form: Tourist', value: '/apply/india-regular-visa/?visaType=Tourist%20visa%20(regular)' }, { label: 'e-Visa transfer to a new passport form', value: '/apply/india-evisa-transfer/' }, { label: 'Contact / question form', value: '/contact-us/' }], hint: 'Which form the Start buttons on this page open.' }
      - { name: applyLabel, label: Apply button text, widget: string, required: false, hint: 'e.g. Start e-Business application' }
      - name: facts
        label: Quick facts in the banner
        label_singular: fact
        widget: list
        required: false
        max: 4
        summary: '{{fields.value}}: {{fields.label}}'
        hint: 'Up to 4 boxes, e.g. "1 year" / "Valid from the date it’s granted". The first one also shows on the homepage tile.'
        fields:
          - { name: value, label: Big text, widget: string }
          - { name: label, label: Small text, widget: string }
      - { name: checklistTitle, label: Checklist title, widget: string, required: false, default: 'Have these ready' }
      - name: checklist
        label: '"Have these ready" checklist'
        label_singular: item
        widget: list
        required: false
        summary: '{{fields.item}}'
        hint: 'Visa pages: the tick list in the banner. Also shown as "What you’ll need" on the homepage tile.'
        fields:
          - { name: item, label: Item, widget: string }
          - { name: hint, label: Small text, widget: string, required: false }
      - { name: purposesTitle, label: '"What you can do" heading', widget: string, required: false }
      - { name: purposesIntro, label: '"What you can do" introduction', widget: text, required: false }
      - name: purposes
        label: '"What you can do" cards'
        label_singular: card
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: icon, label: Icon, widget: select, options: ['briefcase','trade','factory','stall','people','tool','mic','map','book','sun','heart','home','medical','leaf','yoga','school','plane','passport','camera','film','mountain','chart','family','check','info','shield','clock','pin'], default: check }
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: string }
      - { name: notCoveredTitle, label: '"Not covered" box heading', widget: string, required: false }
      - { name: notCovered, label: '"Not covered" points', widget: list, required: false, hint: 'One point per row. Shown in a pink box.' }
      - name: documentsTable
        label: Documents table
        label_singular: document
        widget: list
        required: false
        summary: '{{fields.document}} · {{fields.needed}}'
        fields:
          - { name: document, label: Document, widget: string }
          - { name: details, label: Details, widget: text, required: false }
          - { name: needed, label: Needed, widget: select, options: ['Required', 'If applicable', 'Helpful', 'Optional', 'We prepare'], default: 'Required' }
      - { name: documentsNote, label: Note under the documents table, widget: text, required: false }
      - { name: showSteps, label: 'Show "four steps" band', widget: boolean, default: true, required: false }
      - { name: rulesTitle, label: Rules heading, widget: string, required: false }
      - { name: rulesIntro, label: Rules introduction, widget: text, required: false }
      - name: rules
        label: Rules to know
        label_singular: rule
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: text }
      - { name: boxTitle, label: Teal box heading (under the rules), widget: string, required: false, hint: 'e.g. Need a regular visa? Leave empty for no box.' }
      - { name: boxText, label: Teal box text, widget: text, required: false }
      - { name: boxButton, label: Teal box button text, widget: string, required: false }
      - { name: boxLink, label: Teal box button link, widget: string, required: false, hint: 'e.g. /indian-regular-visa/. Empty = call us.' }
      - { name: showFees, label: Show the fees section, widget: boolean, default: true, required: false }
      - name: prices
        label: Price table
        label_singular: price row
        widget: list
        required: false
        summary: '{{fields.service}} · {{fields.entries}} · {{fields.fee}}'
        hint: 'One row per option, e.g. 30 days, 1 year, 5 years. The total adds itself up when both fees are amounts in pounds. Leave the table empty to show the two fee boxes instead.'
        fields:
          - { name: service, label: Visa, widget: string, hint: 'e.g. e-Tourist visa, 1 year' }
          - { name: included, label: Small text under the name, widget: string, required: false, hint: 'e.g. Up to 180 days a year' }
          - { name: processing, label: Processing time, widget: string, required: false, hint: 'e.g. Usually 3 to 5 working days. Empty shows "Ask us".' }
          - { name: entries, label: Entries, widget: select, required: false, options: ['Single entry', 'Double entry', 'Multiple entries', 'Same as your e-Visa'] }
          - { name: govFee, label: Government fee, widget: string, required: false, hint: 'In pounds, e.g. £40 or 40. Include the bank charge if you pass it on.' }
          - { name: fee, label: Our fee, widget: string, required: false, hint: 'In pounds, e.g. £79. Empty shows "Call for price".' }
      - { name: feesNote, label: Note under the price table, widget: text, required: false }
      - { name: feesTitle, label: Fees heading, widget: string, required: false }
      - { name: govFee, label: Government fee (big text), widget: string, required: false, hint: 'e.g. Set by India. Leave empty for the default.' }
      - { name: govFeeText, label: Government fee explanation, widget: text, required: false }
      - { name: ourFee, label: Our fee for this visa, widget: string, required: false, hint: 'e.g. £79. Leave empty to use the fee in Business details.' }
      - { name: ourFeeText, label: Our fee explanation, widget: text, required: false }
      - { name: widget, label: Special tool on this page, widget: select, required: false, default: '', options: [{ label: 'None', value: '' }, { label: 'Nationality checker and list of eligible countries', value: 'eligibility' }] }
      - name: body
        label: Page text
        label_singular: paragraph
        widget: list
        collapsed: false
        required: false
        field: { name: paragraph, label: Paragraph, widget: text }
        hint: 'Company pages (privacy policy, terms...): one paragraph per box.'
      - name: sections
        label: Guide sections
        label_singular: section
        widget: list
        required: false
        summary: '{{fields.heading}}'
        hint: 'Longer explanations that help Google rank the page. Leave a blank line between paragraphs; start a line with "- " for a bullet point; links: [text](/page-address/).'
        fields:
          - { name: heading, label: Heading, widget: string, hint: 'Use the words people search for, e.g. "Indian business visa requirements".' }
          - { name: text, label: Text, widget: text }
      - { name: faqHeading, label: FAQ heading, widget: string, required: false }
      - name: faqs
        label: FAQs
        label_singular: FAQ
        widget: list
        required: false
        summary: '{{fields.q}}'
        hint: 'Questions clients really ask. Google can show these in search results.'
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: related, label: Related pages, widget: relation, collection: pages, value_field: '{{slug}}', search_fields: [h1], display_fields: [h1], multiple: true, required: false, hint: 'Links shown near the bottom of the page. Good for Google too.' }
      - name: title
        label: 'Google: page title'
        widget: string
        pattern: ['^.{10,65}$', 'Keep it between 10 and 65 characters so Google shows it in full.']
        hint: 'The blue headline in Google results. Put the most important words first.'
      - name: description
        label: 'Google: description'
        widget: text
        pattern: ['^[\s\S]{50,160}$', 'Keep it between 50 and 160 characters so Google shows it in full.']
        hint: 'The grey text under the headline in Google results.'
      - { name: focusKeyword, label: 'SEO: focus keyword', widget: string, required: false, hint: 'The main search you want this page to rank for, e.g. "india business visa uk". Your SEO score and tips appear on the right as you type.' }
      - { name: shareImage, label: 'SEO: social sharing image (optional)', widget: image, required: false, choose_url: false, hint: 'Shown when the page is shared on WhatsApp, Facebook or LinkedIn. Landscape, about 1200 × 630 pixels.' }
      - { name: noindex, label: 'SEO: hide this page from Google', widget: boolean, required: false, default: false, hint: 'The page stays on the website but Google won’t list it.' }
      - { name: hideFromMenus, label: Remove from menus, widget: boolean, required: false, default: false, hint: 'The page stays on the website but is left out of the menus and homepage tiles.' }
      - { name: hidden, label: Move to bin (remove this page from the website), widget: boolean, required: false, default: false, hint: 'Takes the page off the website. Its address then sends visitors to the main page of its section. Switch off to bring it back.' }

  # ---------- Homepage ----------
  - name: homepage
    label: Homepage
    editor: { preview: true }
    files:
      - name: home
        label: Homepage
        file: content/home.json
        fields:
          - { name: heroEyebrow, label: Small label above the heading, widget: string, required: false }
          - { name: heroHeading, label: Main heading, widget: string }
          - { name: heroAccent, label: Main heading second line (saffron), widget: string, required: false }
          - { name: heroIntro, label: Introduction, widget: text }
          - name: steps
            label: The four steps
            label_singular: step
            widget: list
            max: 4
            summary: '{{fields.title}}'
            hint: 'Shown under the banner on the homepage and on every visa page.'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: short, label: Short version (banner), widget: string, required: false }
              - { name: text, label: Text, widget: text }
          - name: heroOptions
            label: Visa options in the banner card
            label_singular: option
            widget: list
            max: 8
            summary: '{{fields.label}} {{fields.sub}}'
            fields:
              - { name: label, label: Name, widget: string, hint: 'e.g. e-Tourist' }
              - { name: sub, label: Small text, widget: string, hint: 'e.g. 30 days' }
              - { name: note, label: What it’s for and what’s needed, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: link, label: Button link, widget: string, hint: 'e.g. /apply/india-visa/?visaType=e-Business%20visa or tel:+441619562003' }
          - { name: tilesTitle, label: Visa tiles heading, widget: string }
          - { name: tilesIntro, label: Visa tiles introduction, widget: text }
          - { name: checksTitle, label: '"What we check" heading', widget: string }
          - { name: checksIntro, label: '"What we check" introduction', widget: text }
          - name: checks
            label: '"What we check" cards'
            label_singular: card
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: icon, label: Icon, widget: select, options: ['briefcase','trade','factory','stall','people','tool','mic','map','book','sun','heart','home','medical','leaf','yoga','school','plane','passport','camera','film','mountain','chart','family','check','info','shield','clock','pin'], default: check }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - name: sections
            label: Guide sections
            label_singular: section
            widget: list
            required: false
            summary: '{{fields.heading}}'
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
          - name: faqs
            label: FAQs
            label_singular: FAQ
            widget: list
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
          - { name: title, label: 'Google: page title', widget: string, pattern: ['^.{10,65}$', 'Keep it between 10 and 65 characters.'] }
          - { name: description, label: 'Google: description', widget: text, pattern: ['^[\s\S]{50,160}$', 'Keep it between 50 and 160 characters.'] }
          - { name: focusKeyword, label: 'SEO: focus keyword', widget: string, required: false }
          - { name: shareImage, label: 'SEO: social sharing image (optional)', widget: image, required: false, choose_url: false }

  # ---------- Form settings ----------
  - name: form_extras
    label: Form settings
    label_singular: form's settings
    description: >-
      Change any online application form: add your own questions, or remove documents and questions you don't need,
      or make them optional. Click "+ form's settings" and choose the form, or open a form that is already listed.
    folder: content/form-extras
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{fields.form}}'
    identifier_field: form
    summary: '{{form}} · {{title}}'
    fields:
      - { name: form, label: Form, widget: select, options: [{ label: 'India e-Visa application (all e-Visa types)', value: 'india-visa' }, { label: 'India regular / Employment visa application', value: 'india-regular-visa' }, { label: 'Transfer an India e-Visa to a new passport', value: 'india-evisa-transfer' }] }
      - { name: title, label: Step title for your extra questions, widget: string, default: 'Additional questions' }
      - { name: hideDocs, label: 'Documents to remove', widget: list, required: false, hint: 'Type part of the document name as it appears on the form, e.g. Flight or Hotel. One per row.' }
      - { name: optionalDocs, label: 'Documents to make optional', widget: list, required: false, hint: 'The document stays on the form, but clients can send without it.' }
      - { name: hideQuestions, label: 'Questions to remove', widget: list, required: false, hint: 'Type part of the question as it appears on the form. Name, passport, email, phone and visa type can’t be removed.' }
      - { name: optionalQuestions, label: 'Questions to make optional', widget: list, required: false }
      - { name: askOnce, label: 'Ask once for the whole application (not for each person)', widget: boolean, default: false, required: false }
      - name: questions
        label: Extra questions
        label_singular: question
        widget: list
        required: false
        summary: '{{fields.label}} ({{fields.type}})'
        hint: 'Remove all questions to take the step off the form.'
        fields:
          - { name: label, label: Question, widget: string }
          - { name: type, label: Type of answer, widget: select, options: ['Short answer', 'Long answer', 'Date', 'Yes / No', 'Choice list', 'Number', 'Email address', 'Phone number', 'Country'], default: 'Short answer' }
          - { name: options, label: 'Choices (for a choice list)', widget: text, required: false, hint: 'One choice per line.' }
          - { name: required, label: Answer required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }

  # ---------- Client forms (send a link and password to a client) ----------
  - name: client_forms
    label: Client forms
    label_singular: client form
    description: >-
      Build a form to send to a client, or start from a template: open a template, choose Duplicate from the Publish menu,
      and change the title. Its address is indianevisaonline.org.uk/client-forms/ followed by the form's file name,
      which is made from the title when you first save (for example /client-forms/patel-family-evisa/).
      Generate a password, then send the client the link and the password separately.
    folder: content/client-forms
    format: json
    extension: json
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    editor: { preview: true }
    fields:
      - { name: title, label: Form title, widget: string, hint: 'Shown at the top of the form, e.g. Spouse visa application: your details. Also used for the address.' }
      - { name: template, label: 'This is a template (not a live form)', widget: boolean, default: false, required: false, hint: 'Templates are never shown to clients. To use one: open it, choose Duplicate from the Publish menu, then change the title, switch this off, generate a password and publish.' }
      - { name: active, label: Form is open, widget: boolean, default: true, required: false, hint: 'Switch off to close the form once the client has finished.' }
      - { name: password, label: Password, widget: password, required: false, hint: 'Click Generate password, then copy it to send to your client. Leave empty for no password.' }
      - { name: intro, label: Introduction, widget: text, required: false }
      - { name: includePassport, label: Ask for a passport scan (fills in their details), widget: boolean, default: true, required: false }
      - { name: maxPeople, label: People on one form (1 to 5), widget: number, value_type: int, min: 1, max: 5, default: 1, hint: 'More than 1 lets the client add family members, each with their own passport and documents.' }
      - { name: questionsTitle, label: Questions step title, widget: string, default: 'Your details', required: false }
      - { name: askOnce, label: 'Ask the questions once (not for each person)', widget: boolean, default: false, required: false }
      - name: questions
        label: Questions
        label_singular: question
        widget: list
        required: false
        summary: '{{fields.label}} ({{fields.type}})'
        fields:
          - { name: label, label: Question, widget: string }
          - { name: type, label: Type of answer, widget: select, options: ['Short answer', 'Long answer', 'Date', 'Yes / No', 'Choice list', 'Number', 'Email address', 'Phone number', 'Country'], default: 'Short answer' }
          - { name: options, label: 'Choices (for a choice list)', widget: text, required: false, hint: 'One choice per line.' }
          - { name: required, label: Answer required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }
      - name: uploads
        label: Named document uploads (up to 8)
        label_singular: document
        widget: list
        required: false
        max: 8
        summary: '{{fields.label}}'
        hint: 'Clients can always add as many other documents as they need with "Add another document".'
        fields:
          - { name: label, label: Document, widget: string }
          - { name: required, label: Required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }

  # ---------- Blog ----------
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: >-
      News and guides for your blog. Click "New Blog post" to write one. Posts appear at /blog/, newest first.
    folder: content/blog
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{fields.h1}}'
    identifier_field: h1
    summary: '{{date}} · {{h1}}'
    preview_path: 'blog/{{slug}}/'
    fields:
      - { name: h1, label: Post title (heading), widget: string, hint: 'The headline readers see. Also used for the post’s web address when you first save it.' }
      - { name: date, label: Date published, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true }
      - { name: updated, label: Date updated (optional), widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true, required: false }
      - { name: category, label: Category, widget: select, options: ['e-Visa guides', 'Rule changes', 'Travel tips', 'News'], default: 'e-Visa guides' }
      - { name: intro, label: Summary, widget: text, hint: 'Two or three sentences shown on the blog page and under the headline.' }
      - name: sections
        label: Post sections
        label_singular: section
        widget: list
        summary: '{{fields.heading}}'
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
      - name: faqs
        label: FAQs (optional)
        label_singular: FAQ
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: relatedPage, label: Button link (optional), widget: string, required: false, hint: 'A page on your site to send readers to, e.g. /india-e-business-visa-for-uk-citizens/' }
