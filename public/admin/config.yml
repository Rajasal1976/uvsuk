# Website editor settings (Decap CMS). https://decapcms.org/docs/
#
# Connected to the GitHub repository Rajasal1976/uvsuk.

backend:
  name: github
  repo: Rajasal1976/uvsuk
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    update: 'Edit {{collection}}: {{slug}}'
    uploadMedia: 'Upload photo {{path}}'

# Lets the editor work on a computer for testing (only when the site runs on localhost)
local_backend: true

site_url: https://www.uvsuk.co.uk
display_url: https://www.uvsuk.co.uk
logo_url: /favicon.svg
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------- Visa and service pages ----------
  - name: pages
    label: Visa & service pages
    label_singular: Page
    description: >-
      Every page on the website, grouped by country (A to Z), with UK pages under UK and company pages at the end.
      Click a page to edit its text, prices and FAQs, then click Publish. The website updates in about a minute.
      To add a brand-new page, ask your developer.
    folder: content/pages
    format: json
    extension: json
    create: false
    delete: false
    identifier_field: h1
    summary: '{{country}}  ›  {{h1}}'
    sortable_fields:
      - { field: sortKey, label: Country, default_sort: asc }
      - { field: h1, label: Page heading }
    view_groups:
      - { label: Country, field: country }
    editor: { preview: true }
    fields:
      - { name: country, label: Country, widget: hidden }
      - { name: sortKey, label: Order in the list, widget: hidden }
      - { name: faqHeading, label: FAQ heading, widget: hidden, required: false }
      - { name: h1, label: Page heading, widget: string, hint: 'The big heading at the top of the page.' }
      - { name: intro, label: Introduction, widget: text, required: false, hint: 'One or two sentences under the heading.' }
      - { name: applyButton, label: Apply button, widget: select, default: none, options: [{ label: 'No button', value: 'none' }, { label: 'Apply online → China visa form', value: '/apply/china-visa/' }, { label: 'Apply online → India eVisa form', value: '/apply/india-visa/' }, { label: 'Apply online → Sri Lanka ETA form', value: '/apply/sri-lanka-eta/' }, { label: 'Apply online → Schengen visa form', value: '/apply/schengen-visa/' }, { label: 'Apply online → USA ESTA or visa form', value: '/apply/usa-visa/' }, { label: 'Apply online → Saudi Arabia visa form', value: '/apply/saudi-visa/' }, { label: 'Apply online → Ghana visa form', value: '/apply/ghana-visa/' }, { label: 'Apply online → Nigeria regular visa form', value: '/apply/nigeria-visa/' }, { label: 'Apply online → Russian visa form', value: '/apply/russia-visa/' }, { label: 'Apply online → India Employment / regular visa form', value: '/apply/india-regular-visa/' }, { label: 'Apply online → India eVisa transfer to new passport', value: '/apply/india-evisa-transfer/' }, { label: 'Apply online → eVisa form (other countries)', value: '/apply/evisa/' }, { label: 'Apply online → Document legalisation form', value: '/apply/document-legalisation/' }, { label: 'Apply online → Indian passport / OCI form', value: '/apply/indian-passport-oci/' }, { label: 'Apply online → Second UK passport form', value: '/apply/second-uk-passport/' }, { label: 'Apply online → list of all forms', value: '/apply/' }, { label: 'Apply now → contact / enquiry form', value: '/contact-us/' }], hint: 'A gold button under the introduction. Pick the form it should open.' }
      - name: eligibility
        label: '"Do you qualify?" points'
        label_singular: point
        widget: list
        collapsed: false
        required: false
        field: { name: point, label: Point, widget: string }
        hint: 'Visa pages only (not used on the China, ILR, Skilled Worker and eVisas pages, which have their own layout). One requirement per line.'
      - name: documentsTable
        label: Documents table
        label_singular: document
        widget: list
        required: false
        summary: '{{fields.document}} · {{fields.needed}}'
        hint: 'Shown as the "Documents you’ll need" table. Drag to reorder.'
        fields:
          - { name: document, label: Document, widget: string, hint: 'Short name, e.g. Passport, Invitation letter' }
          - { name: details, label: Details, widget: text, required: false }
          - { name: needed, label: Needed, widget: select, options: ['Required', 'We prepare', 'If not British', 'If applicable', 'Optional'], default: 'Required' }
      - name: sections
        label: Guide sections
        label_singular: section
        widget: list
        required: false
        summary: '{{fields.heading}}'
        hint: 'Longer explanations that help Google rank the page. One heading per section. Leave a blank line between paragraphs; start a line with "- " for a bullet point.'
        fields:
          - { name: heading, label: Heading, widget: string, hint: 'Use the words people search for, e.g. "Spouse visa financial requirement 2026".' }
          - { name: text, label: Text, widget: text }
      - name: prices
        label: Price table
        label_singular: price row
        widget: list
        required: false
        summary: '{{fields.service}}: {{fields.fee}}'
        hint: 'Travel visa and eVisa pages only.'
        fields:
          - { name: service, label: Service, widget: string, hint: 'For example Standard, Express or Urgent.' }
          - { name: included, label: "What's included", widget: string, required: false }
          - { name: processing, label: Processing time, widget: string, required: false, hint: 'For example 5 working days.' }
          - { name: processingFee, label: Processing fee, widget: string, required: false, hint: 'The embassy, visa centre or official eVisa fee, for example £85.' }
          - { name: fee, label: Our fee, widget: string, required: false, hint: 'For example £95. Leave empty to show "Call for price".' }
          - { name: total, label: Total (optional), widget: string, required: false, hint: 'Leave empty and it''s added up for you from the two fees.' }
          - { name: popular, label: Mark as most popular, widget: boolean, required: false, default: false }
      - name: body
        label: Page text
        label_singular: paragraph
        widget: list
        collapsed: false
        required: false
        field: { name: paragraph, label: Paragraph, widget: text }
        hint: 'Company pages only (About, Fees, Privacy policy and so on). One paragraph per box.'
      - name: faqs
        label: FAQs
        label_singular: FAQ
        widget: list
        required: false
        summary: '{{fields.q}}'
        hint: 'Questions clients really ask. Google can show these in search results. Drag to reorder.'
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: govuk, label: GOV.UK link (optional), widget: string, required: false, hint: 'Link to the official rules or fees page, if there is one.' }
      - name: title
        label: 'Google: page title'
        widget: string
        pattern: ['^.{10,65}$', 'Keep it between 10 and 65 characters so Google shows it in full.']
        hint: 'The blue headline in Google results. Put the most important words first.'
      - name: description
        label: 'Google: description'
        widget: text
        pattern: ['^[\s\S]{50,160}$', 'Keep it between 50 and 160 characters so Google shows it in full.']
        hint: 'The grey text under the headline in Google results.'
      - name: focusKeyword
        label: 'SEO: focus keyword'
        widget: string
        required: false
        hint: 'The main search you want this page to rank for, e.g. "spouse visa Manchester". Your SEO score and tips appear on the right as you type.'
      - name: shareImage
        label: 'SEO: social sharing image (optional)'
        widget: image
        required: false
        choose_url: false
        hint: 'Shown when the page is shared on WhatsApp, Facebook or LinkedIn. Landscape, about 1200 × 630 pixels. If empty, the default image from Business details is used.'
      - name: hideFromMenus
        label: 'Remove from menus and drop-downs'
        widget: boolean
        required: false
        default: false
        hint: 'The page stays on the website, but is taken out of the menus, the eVisa menu and the homepage visa finder. On a country’s main page, this removes the whole country from them.'
      - name: hidden
        label: 'Move to bin (hide this page)'
        widget: boolean
        required: false
        default: false
        hint: 'Like the WordPress bin: the page disappears from the website, menus, page cards and the visa finder, and anyone visiting its address is sent to the page above it. Switch off again to restore it. Pages can’t be permanently deleted here, so nothing is lost by mistake. (Doesn’t apply to the ILR, Skilled Worker, China, China business and eVisas pages, which have special designs.)'
      - name: noindex
        label: 'SEO: hide this page from Google'
        widget: boolean
        required: false
        default: false
        hint: 'Only switch this on for pages you don’t want in search results.'

  # ---------- Pages with calculators or special design ----------
  # ---------- Extra questions on the online application forms ----------
  - name: form_extras
    label: Form settings
    label_singular: form's settings
    description: >-
      Change any online application form: add your own questions, or remove documents and questions you don't need.
      Click "+ form's settings" and choose the form, or open a form that is already listed.
    folder: content/form-extras
    format: json
    extension: json
    create: true
    delete: false
    slug: '{{fields.form}}'
    identifier_field: form
    summary: '{{form}} · {{title}}'
    fields:
      - { name: form, label: Form, widget: select, options: [{ label: 'China visa application', value: 'china-visa' }, { label: 'India eVisa application', value: 'india-visa' }, { label: 'Transfer your India eVisa to a new passport', value: 'india-evisa-transfer' }, { label: 'Sri Lanka ETA application', value: 'sri-lanka-eta' }, { label: 'Japan visa application', value: 'japan-visa' }, { label: 'Nigeria visa application (regular visa)', value: 'nigeria-visa' }, { label: 'Schengen visa application', value: 'schengen-visa' }, { label: 'USA ESTA or visa application', value: 'usa-visa' }, { label: 'Saudi Arabia visa application', value: 'saudi-visa' }, { label: 'Ghana visa application', value: 'ghana-visa' }, { label: 'Russian visa application', value: 'russia-visa' }, { label: 'India Employment and regular visa application', value: 'india-regular-visa' }, { label: 'eVisa application', value: 'evisa' }, { label: 'Document legalisation request', value: 'document-legalisation' }, { label: 'Indian passport, surrender certificate and OCI request', value: 'indian-passport-oci' }, { label: 'Second British passport application', value: 'second-uk-passport' }] }
      - { name: title, label: Step title, widget: string, default: 'Additional questions' }
      - { name: hideDocs, label: 'Documents to remove', widget: list, required: false, hint: 'Type part of the document name as it appears on the form, e.g. Flight or Hotel. One per row.' }
      - { name: optionalDocs, label: 'Documents to make optional', widget: list, required: false, hint: 'The document stays on the form, but clients can send without it.' }
      - { name: hideQuestions, label: 'Questions to remove', widget: list, required: false, hint: 'Type part of the question as it appears on the form. Name, passport, email, phone and visa type can’t be removed.' }
      - { name: optionalQuestions, label: 'Questions to make optional', widget: list, required: false }
      - { name: askOnce, label: 'Ask once for the whole application (not for each person)', widget: boolean, default: false, required: false }
      - name: questions
        label: Extra questions
        label_singular: question
        widget: list
        required: false
        summary: '{{fields.label}} ({{fields.type}})'
        hint: 'Remove all questions to take the step off the form.'
        fields:
          - { name: label, label: Question, widget: string }
          - { name: type, label: Type of answer, widget: select, options: ['Short answer', 'Long answer', 'Date', 'Yes / No', 'Choice list', 'Number', 'Email address', 'Phone number', 'Country'], default: 'Short answer' }
          - { name: options, label: 'Choices (for a choice list)', widget: text, required: false, hint: 'One choice per line.' }
          - { name: required, label: Answer required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }

  # ---------- Client forms (send a link and password to a client) ----------
  - name: client_forms
    label: Client forms
    label_singular: client form
    description: >-
      Build a form to send to a client, or start from a template: open a template, choose Duplicate from the Publish menu,
      and change the title. Its address is www.uvsuk.co.uk/client-forms/ followed by the form's file name,
      which is made from the title when you first save (for example /client-forms/khan-family-spouse-visa/).
      Generate a password, then send the client the link and the password separately.
    folder: content/client-forms
    format: json
    extension: json
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    editor: { preview: true }
    fields:
      - { name: title, label: Form title, widget: string, hint: 'Shown at the top of the form, e.g. Spouse visa application: your details. Also used for the address.' }
      - { name: template, label: 'This is a template (not a live form)', widget: boolean, default: false, required: false, hint: 'Templates are never shown to clients. To use one: open it, choose Duplicate from the Publish menu, then change the title, switch this off, generate a password and publish.' }
      - { name: active, label: Form is open, widget: boolean, default: true, required: false, hint: 'Switch off to close the form once the client has finished.' }
      - { name: password, label: Password, widget: password, required: false, hint: 'Click Generate password, then copy it to send to your client. Leave empty for no password.' }
      - { name: intro, label: Introduction, widget: text, required: false }
      - { name: includePassport, label: Ask for a passport scan (fills in their details), widget: boolean, default: true, required: false }
      - { name: maxPeople, label: People on one form (1 to 5), widget: number, value_type: int, min: 1, max: 5, default: 1, hint: 'More than 1 lets the client add family members, each with their own passport and documents.' }
      - { name: questionsTitle, label: Questions step title, widget: string, default: 'Your details', required: false }
      - { name: askOnce, label: 'Ask the questions once (not for each person)', widget: boolean, default: false, required: false }
      - name: questions
        label: Questions
        label_singular: question
        widget: list
        required: false
        summary: '{{fields.label}} ({{fields.type}})'
        fields:
          - { name: label, label: Question, widget: string }
          - { name: type, label: Type of answer, widget: select, options: ['Short answer', 'Long answer', 'Date', 'Yes / No', 'Choice list', 'Number', 'Email address', 'Phone number', 'Country'], default: 'Short answer' }
          - { name: options, label: 'Choices (for a choice list)', widget: text, required: false, hint: 'One choice per line.' }
          - { name: required, label: Answer required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }
      - name: uploads
        label: Named document uploads (up to 8)
        label_singular: document
        widget: list
        required: false
        max: 8
        summary: '{{fields.label}}'
        hint: 'Clients can always add as many other documents as they need with "Add another document".'
        fields:
          - { name: label, label: Document, widget: string }
          - { name: required, label: Required, widget: boolean, default: true, required: false }
          - { name: hint, label: Help text (optional), widget: string, required: false }

  # ---------- Blog ----------
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: >-
      News and guides for your blog. Click "New Blog post" to write a new one. Posts appear at /blog/ newest first.
    folder: content/blog
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{fields.h1}}'
    identifier_field: h1
    summary: '{{date}} · {{h1}}'
    sortable_fields: ['date', 'h1']
    editor: { preview: true }
    fields:
      - { name: h1, label: Post title (heading), widget: string, hint: 'The headline readers see. Also used for the post’s web address when you first save it.' }
      - { name: date, label: Date published, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true }
      - { name: updated, label: Date updated (optional), widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, picker_utc: true, required: false }
      - { name: category, label: Category, widget: select, options: ['UK immigration', 'Travel visas', 'News'], default: 'News' }
      - { name: intro, label: Summary, widget: text, hint: 'Two or three sentences shown on the blog page and under the headline.' }
      - name: sections
        label: Post sections
        label_singular: section
        widget: list
        summary: '{{fields.heading}}'
        hint: 'Leave a blank line between paragraphs. Start a line with "- " for a bullet point. Links: [link text](https://example.com).'
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
      - name: faqs
        label: FAQs (optional)
        label_singular: FAQ
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: relatedPage, label: Button link (optional), widget: string, required: false, hint: 'A page on your site to send readers to, e.g. /post-study-work-visa/' }
      - { name: relatedLabel, label: Button text (optional), widget: string, required: false, hint: 'e.g. Apply for your Graduate visa' }
      - { name: title, label: 'Google: page title', widget: string, pattern: ['^.{10,65}$', 'Keep it between 10 and 65 characters.'] }
      - { name: description, label: 'Google: description', widget: text, pattern: ['^[\s\S]{50,160}$', 'Keep it between 50 and 160 characters.'] }
      - { name: focusKeyword, label: 'SEO: focus keyword', widget: string, required: false }
      - { name: shareImage, label: 'SEO: social sharing image (optional)', widget: image, required: false, choose_url: false }
      - { name: draft, label: 'Draft (hide from the website)', widget: boolean, required: false, default: false }

  # ---------- Homepage ----------
  - name: homepage
    label: Homepage
    editor: { preview: true }
    files:
      - name: home
        label: Homepage
        file: content/home.json
        fields:
          - { name: heroEyebrow, label: Small line above the heading, widget: string }
          - { name: heroHeading, label: Main heading, widget: string }
          - { name: heroIntro, label: Introduction, widget: text }
          - name: popularLinks
            label: Popular links (beside the visa search)
            label_singular: link
            widget: list
            max: 8
            required: false
            summary: '{{fields.label}}'
            hint: 'Up to 8 buttons. Leave empty to use the standard list.'
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: url, label: Page address, widget: string, hint: 'e.g. /china-visa-application/' }
          - name: heroPoints
            label: Selling points (under the buttons)
            label_singular: selling point
            widget: list
            max: 3
            summary: '{{fields.title}}'
            hint: 'Up to three short reasons to choose you. Keep each title to a few words and the text to one line.'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: string }
          - { name: heroPhoto, label: Main photo, widget: image, required: false, choose_url: false, hint: 'A landscape photo, about 1200 pixels wide. JPG under 300 KB keeps the site fast.' }
          - { name: heroPhotoAlt, label: Main photo description, widget: string, hint: 'Describe the photo for blind visitors and Google, e.g. "Raj and Sunita with a client in our office".' }
          - { name: advisersPhoto, label: Advisers photo, widget: image, required: false, choose_url: false, hint: 'About 1000 pixels wide. JPG under 300 KB.' }
          - { name: advisersPhotoAlt, label: Advisers photo description, widget: string }
          - { name: advisersIntro, label: '"Meet your advisers" text', widget: text }
          - { name: iaaLogo, label: IAA logo, widget: image, required: false, choose_url: false, hint: 'The official logo file the Immigration Advice Authority gave you, as PNG or SVG. Shown next to your registration details.' }
          - { name: consultationFrom, label: Consultation price, widget: string, hint: 'Shown as "Consultations from …", e.g. £50.' }
          - name: reviews
            label: Client reviews
            label_singular: review
            widget: list
            summary: '{{fields.quote}}'
            hint: 'Use real reviews only, word for word. These show on the homepage and above the footer on every other page. With more than three, they change every few seconds.'
            fields:
              - { name: quote, label: Review, widget: text }
              - { name: source, label: Where it's from, widget: string, hint: 'e.g. Google review · UK visa' }
          - name: sections
            label: Guide sections
            label_singular: section
            widget: list
            required: false
            summary: '{{fields.heading}}'
            hint: 'Shown above the FAQs. Leave a blank line between paragraphs; start a line with "- " for a bullet point.'
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
          - name: faqs
            label: FAQs
            label_singular: FAQ
            widget: list
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
          - { name: title, label: 'Google: page title', widget: string, pattern: ['^.{10,65}$', 'Keep it between 10 and 65 characters.'] }
          - { name: description, label: 'Google: description', widget: text, pattern: ['^[\s\S]{50,160}$', 'Keep it between 50 and 160 characters.'] }
          - { name: focusKeyword, label: 'SEO: focus keyword', widget: string, required: false, hint: 'e.g. "immigration advisers Manchester". Your SEO score appears on the right.' }
          - { name: shareImage, label: 'SEO: social sharing image (optional)', widget: image, required: false, choose_url: false, hint: 'Landscape, about 1200 × 630 pixels.' }

  # ---------- Business details ----------
  - name: settings
    label: Business details
    editor: { preview: false }
    files:
      - name: settings
        label: Business details
        description: These appear across the whole site. Keep them identical to your Google Business Profile.
        file: content/settings.json
        fields:
          - { name: shareImage, label: 'Default social sharing image', widget: image, required: false, choose_url: false, hint: 'Used when a page without its own image is shared on WhatsApp, Facebook or LinkedIn. Landscape, about 1200 × 630 pixels.' }
          - { name: siteLogo, label: Website logo, widget: image, required: false, choose_url: false, hint: 'Shown at the top of every page instead of the business name. A PNG with a transparent background works best, at least 400 pixels wide.' }
          - { name: phone, label: Phone number, widget: string }
          - { name: email, label: Email address, widget: string }
          - { name: addressLine1, label: Address, widget: string }
          - { name: city, label: Town or city, widget: string }
          - { name: postcode, label: Postcode, widget: string }
          - { name: hours, label: Opening hours, widget: string, hint: 'As shown on the site, e.g. Mon–Fri 9am–5pm' }
          - { name: hoursForGoogle, label: Opening hours for Google, widget: string, hint: 'Same hours in Google''s format, e.g. Mo-Fr 09:00-17:00' }
          - { name: yearsInPractice, label: Years in practice, widget: string }
          - { name: applicationsHandled, label: Applications handled, widget: string, hint: 'e.g. 5,000+' }
          - { name: googleRating, label: Google rating, widget: string, hint: 'e.g. 4.8' }
          - { name: googleReviewCount, label: Number of Google reviews, widget: string }
          - { name: googleReviewsUrl, label: Link to your Google reviews, widget: string, required: false }
          - { name: trustpilotUrl, label: Link to your Trustpilot page, widget: string, required: false, hint: 'e.g. https://uk.trustpilot.com/review/uvsuk.co.uk. Leave empty to hide the Trustpilot badge.' }
          - { name: trustpilotRating, label: Trustpilot rating, widget: string, required: false, hint: 'Exactly as Trustpilot shows it, e.g. 4.7' }
          - { name: trustpilotCount, label: Number of Trustpilot reviews, widget: string, required: false }
          - { name: companyNumber, label: Company number, widget: string }
          - name: delivery
            label: Passport return prices (travel visas)
            label_singular: delivery option
            widget: list
            summary: '{{fields.service}}: {{fields.price}}'
            hint: 'Shown on every travel visa page. Not shown on eVisa pages.'
            fields:
              - { name: service, label: Delivery option, widget: string }
              - { name: price, label: Price, widget: string, hint: 'For example £15, or "We’ll quote".' }
          - { name: evisaDelivery, label: eVisa delivery price, widget: string, hint: 'Shown on every eVisa page, e.g. £5.' }
          - { name: facebook, label: Facebook page link, widget: string, required: false, hint: 'The full web address, e.g. https://www.facebook.com/yourpage. Leave empty to hide the icon.' }
          - { name: instagram, label: Instagram link, widget: string, required: false, hint: 'e.g. https://www.instagram.com/yourname' }
          - { name: linkedin, label: LinkedIn link, widget: string, required: false, hint: 'e.g. https://www.linkedin.com/company/yourcompany' }
          - { name: x, label: X (Twitter) link, widget: string, required: false, hint: 'e.g. https://x.com/yourname' }
          - { name: tiktok, label: TikTok link, widget: string, required: false, hint: 'e.g. https://www.tiktok.com/@yourname' }
          - { name: youtube, label: YouTube link, widget: string, required: false, hint: 'e.g. https://www.youtube.com/@yourchannel' }
          - { name: whatsapp, label: WhatsApp link, widget: string, required: false, hint: 'e.g. https://wa.me/441619562003 (your number in international format, no + or spaces).' }
